<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>간호 부서 매칭</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #4f6df5;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .description {
            font-size: 18px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .start-button {
            display: inline-block;
            padding: 16px 40px;
            background-color: #4f6df5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .start-button:hover {
            background-color: #3d58d8;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 70px;
        }

        .feature {
            width: 250px;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .feature h3 {
            margin-bottom: 10px;
        }

        .feature p {
            color: #777;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        NURSE MATCH
    </div>

    <h1>
        나에게 맞는<br>
        간호 부서를 찾아보세요
    </h1>

    <p class="description">
        성향, 실습 경험, 관심 분야를 바탕으로<br>
        나에게 적합한 간호 부서를 추천해드립니다.
    </p>

    <a href="/question" class="start-button">
        매칭 시작하기
    </a>

    <div class="features">

        <div class="feature">
            <h3>성향 분석</h3>
            <p>
                나의 성격과 업무 스타일을 분석합니다.
            </p>
        </div>

        <div class="feature">
            <h3>실습 경험</h3>
            <p>
                학교 및 병원 실습 경험을 고려합니다.
            </p>
        </div>

        <div class="feature">
            <h3>부서 추천</h3>
            <p>
                분석 결과를 바탕으로 적합한 부서를 추천합니다.
            </p>
        </div>

    </div>

</div>

</body>
</html>
